version: '3.8'

#  Required env vars (set in .env or export before running):
#    DB_PASSWORD        — PostgreSQL password
#    JWT_SECRET         — JWT signing key
#
#  Optional env vars:
#    DB_NAME            — database name            (default: msadetector)
#    DB_USERNAME        — database user             (default: postgres)
#    VERSION            — backend image tag         (default: latest)
#    FRONTEND_VERSION   — frontend image tag        (default: latest)

services:
  postgres:
    image: postgres:16-alpine
    container_name: msadetector-db-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-msadetector}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - msadetector-network-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    image: msadetector/backend:${VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msadetector-backend-prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-msadetector}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
      - JWT_SECRET=${JWT_SECRET:?JWT secret required}
      - WORKSPACE_DIR=/app/workspace
      - DESIGNITE_JAR_PATH=/app/lib/DesigniteJava.jar
      - SERVER_PORT=8080
    expose:
      - "8080"
    volumes:
      - workspace_data_prod:/app/workspace
      - ./lib/DesigniteJava.jar:/app/lib/DesigniteJava.jar:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - msadetector-network-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # Nginx serves the Angular SPA and proxies /api → backend:8080
  # This is the ONLY container that exposes ports to the host
  frontend:
    image: msadetector/frontend:${FRONTEND_VERSION:-latest}
    build:
      context: ../dissertation_frontend
      dockerfile: Dockerfile
    container_name: msadetector-frontend-prod
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - msadetector-network-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data_prod:
  workspace_data_prod:

networks:
  msadetector-network-prod:
    driver: bridge
