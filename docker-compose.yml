version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: msadetector-db
    environment:
      POSTGRES_DB: msadetector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - msadetector-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msadetector-backend
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=msadetector
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - FLYWAY_REPAIR_ON_MIGRATE=${FLYWAY_REPAIR_ON_MIGRATE:-false}
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production-please
      - WORKSPACE_DIR=/app/workspace
      - DESIGNITE_JAR_PATH=/app/lib/DesigniteJava.jar
    ports:
      - "8080:8080"
    volumes:
      - workspace_data:/app/workspace
      - ./lib/DesigniteJava.jar:/app/lib/DesigniteJava.jar:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - msadetector-network
    restart: unless-stopped

  # Builds from the sibling frontend repository.
  # Adjust 'context' if your directory layout differs.
  frontend:
    build:
      context: ../dissertation_frontend
      dockerfile: Dockerfile
    container_name: msadetector-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - msadetector-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: msadetector-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@msadetector.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - msadetector-network
    profiles:
      - tools

volumes:
  postgres_data:
  workspace_data:

networks:
  msadetector-network:
    driver: bridge
