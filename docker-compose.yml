version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: msadetector-db
    environment:
      POSTGRES_DB: msadetector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - msadetector-network

  # Redis (for caching and job queue - optional)
  redis:
    image: redis:7-alpine
    container_name: msadetector-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - msadetector-network

  # MSA Detector Backend
  backend:
    build:
      # context: ../../../../../AppData/Local/Temp/Rar$DRa27388.40739.rartemp/dissertation_backend
      context: .
      dockerfile: Dockerfile
    container_name: msadetector-backend
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=msadetector
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production-please
      - WORKSPACE_DIR=/app/workspace
      - DESIGNITE_JAR_PATH=/app/lib/DesigniteJava.jar
    ports:
      - "8080:8080"
    volumes:
      - workspace_data:/app/workspace
      - ./lib/DesigniteJava.jar:/app/lib/DesigniteJava.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - msadetector-network

  # pgAdmin (optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: msadetector-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@msadetector.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - msadetector-network
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  workspace_data:

networks:
  msadetector-network:
    driver: bridge
