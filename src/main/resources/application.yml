spring:
  application:
    name: msa-detector

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:msadetector}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  jackson:
    #serialization:
      #write-dates-as-timestamps: false
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:msa-detector-jwt-secret-key-change-this-in-production-please}
    expiration-ms: ${JWT_EXPIRATION:86400000}

  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:5}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:100}

  upload:
    max-uncompressed-size-bytes: ${UPLOAD_MAX_UNCOMPRESSED_SIZE_BYTES:1073741824}
    max-entries: ${UPLOAD_MAX_ENTRIES:100000}
    max-depth: ${UPLOAD_MAX_DEPTH:50}

  analysis:
    workspace-dir: ${WORKSPACE_DIR:/tmp/msa-detector/workspace}
    designite-jar-path: ${DESIGNITE_JAR_PATH:/opt/designite/DesigniteJava.jar}
    clone-timeout-seconds: ${CLONE_TIMEOUT:300}
    analysis-timeout-seconds: ${ANALYSIS_TIMEOUT:1800}

  thresholds:
    nano-service-max-loc: ${NANO_MAX_LOC:500}
    nano-service-max-endpoints: ${NANO_MAX_ENDPOINTS:2}
    chatty-service-min-calls: ${CHATTY_MIN_CALLS:5}
    esb-mediator-threshold: ${ESB_MEDIATOR_THRESHOLD:0.4}
    code-smell-density-threshold: ${CODE_SMELL_DENSITY_THRESHOLD:80}
    god-service-field-count: ${GOD_SERVICE_FIELD_COUNT:25}
    god-service-public-methods: ${GOD_SERVICE_PUBLIC_METHODS:30}
    god-service-loc: ${GOD_SERVICE_LOC:1000}
    god-service-import-domains: ${GOD_SERVICE_IMPORT_DOMAINS:20}
    god-service-constructor-params: ${GOD_SERVICE_CONSTRUCTOR_PARAMS:12}
    god-service-tcc-threshold: ${GOD_SERVICE_TCC_THRESHOLD:0.5}
    god-service-min-metrics: ${GOD_SERVICE_MIN_METRICS:3}
    distributed-monolith-high-coupling: ${DISTRIBUTED_MONOLITH_HIGH_COUPLING:0.5}
    distributed-monolith-connected-ratio: ${DISTRIBUTED_MONOLITH_CONNECTED_RATIO:0.8}
    distributed-monolith-moderate-coupling: ${DISTRIBUTED_MONOLITH_MODERATE_COUPLING:0.3}

logging:
  level:
    root: INFO
    com.msadetector: DEBUG
    org.flywaydb: INFO
    # Silence Hibernate SQL & query logging
    org.hibernate.SQL: OFF
    org.hibernate.type: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.stat: OFF
    org.hibernate.engine: WARN
    org.hibernate.event: WARN
    org.hibernate.cache: WARN
    org.hibernate.resource: WARN
    # Silence Spring Data / JPA internals
    org.springframework.orm.jpa: WARN
    org.springframework.transaction: WARN
    org.springframework.data: WARN
    # Suppress 'Using generated security password' warning (no auth in use)
    org.springframework.boot.autoconfigure.security: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none

logging:
  level:
    com.msadetector: DEBUG

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod


  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

logging:
  level:
    root: WARN
    com.msadetector: INFO
